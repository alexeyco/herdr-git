[package]
name = "herdr-gitui"
version = "0.3.0"
edition = "2024"
license = "MIT"
rust-version = "1.96.1"
description = "herdr plugin that opens gitui in a new tab and reports what the session changed to the agent"
repository = "https://github.com/alexeyco/herdr-gitui"
readme = "README.md"
keywords = ["herdr", "gitui", "plugin", "cli", "git-tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
mockall = "0.15"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

[lints.clippy]
all = "warn"
